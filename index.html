<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e9eef2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1114" media="(prefers-color-scheme: dark)">
<title>냉장고 재고 · 할일 · 문자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9eef2; --surface:#ffffff; --surface-2:#f2f5f9; --bar:rgba(233,238,242,.82);
  --ink:#101519; --ink-2:#5d6b78; --ink-on:#ffffff;
  --line:#dbe3ea; --focus:#2e7fa8;
  --chill:#2e7fa8; --freeze:#4b5fd1; --room:#a8761c;
  --plus:#0f8f83; --minus:#cf4f46; --bubble:#2e7fa8;
  --plus-soft:rgba(15,143,131,.11); --minus-soft:rgba(207,79,70,.11);
  --r:16px;
  --shadow:0 1px 2px rgba(16,21,25,.05), 0 8px 22px rgba(16,21,25,.055);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1114; --surface:#161c21; --surface-2:#1c242a; --bar:rgba(13,17,20,.82);
    --ink:#e8eef3; --ink-2:#94a2ad; --ink-on:#0d1114;
    --line:#28313a; --focus:#6fb6d8;
    --chill:#6fb6d8; --freeze:#8e9bf0; --room:#d9a94a;
    --plus:#3fbfad; --minus:#f0736a; --bubble:#2c6c8e;
    --plus-soft:rgba(63,191,173,.13); --minus-soft:rgba(240,115,106,.13);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.28);
  }
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  line-height:1.45;-webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{max-width:560px;margin:0 auto;padding:20px 16px calc(104px + env(safe-area-inset-bottom))}

/* ── header ─────────────────────────────── */
.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--ink-2)}
h1{margin:7px 0 0;font-size:31px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
h1 span{font-weight:300;color:var(--ink-2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-top:16px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stat{background:var(--surface);border:0;padding:11px 12px 12px;text-align:left;cursor:pointer;display:block}
.stat__k{display:block;font-size:11px;color:var(--ink-2)}
.stat__v{display:block;font-size:23px;font-weight:600;letter-spacing:-.02em;margin-top:1px}
.stat__v i{font-style:normal;font-size:11.5px;font-weight:400;color:var(--ink-2);margin-left:3px}
.stat--alert .stat__v{color:var(--minus)}

/* ── tabs ───────────────────────────────── */
.tabs{position:relative;display:grid;grid-template-columns:repeat(3,1fr);margin:14px 0 16px;padding:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px}
.thumb{position:absolute;top:4px;left:4px;height:calc(100% - 8px);width:calc((100% - 8px)/3);background:var(--surface);border-radius:10px;box-shadow:var(--shadow);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.tab{position:relative;z-index:1;border:0;background:transparent;padding:9px 4px;border-radius:10px;font-size:14px;font-weight:600;color:var(--ink-2);cursor:pointer}
.tab.is-on{color:var(--ink)}

/* ── chips + search ─────────────────────── */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink-2);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.chip.is-on{background:var(--ink);border-color:var(--ink);color:var(--ink-on)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--zone,currentColor)}
.search{position:relative;margin-bottom:12px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-2)}
.search input{padding-left:38px}
input,select,textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;outline:none;appearance:none}
input::placeholder,textarea::placeholder{color:var(--ink-2);opacity:.75}
input:focus,select:focus,textarea:focus{border-color:var(--focus)}
textarea{resize:vertical;line-height:1.55}

/* ── list rows ──────────────────────────── */
.list{display:flex;flex-direction:column;gap:8px}
.row{position:relative;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);background:var(--surface)}
.row.in{animation:rise .4s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 26ms)}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.track{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 20px;opacity:0;transition:opacity .12s}
.row.is-drag .track{opacity:1}
.row.dir-plus .track{background:var(--plus-soft)}
.row.dir-minus .track{background:var(--minus-soft)}
.hint{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:600;letter-spacing:-.01em}
.hint b{font-size:27px;font-weight:600;letter-spacing:-.03em;line-height:1}
.hint--plus{color:var(--plus)}
.hint--minus{color:var(--minus)}
.card{position:relative;display:flex;align-items:center;gap:8px;padding:13px 10px 13px 15px;background:var(--surface);border-left:3px solid var(--zone,var(--line));touch-action:pan-y;will-change:transform;user-select:none;-webkit-user-select:none}
.card .more{width:30px;height:34px;background:transparent;font-size:17px;letter-spacing:1px}
.card .more:active{background:var(--surface-2)}
.main{flex:1;min-width:0;padding:0;border:0;background:transparent;text-align:left;cursor:pointer}
.name{display:block;font-size:15.5px;font-weight:600;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:12px;color:var(--ink-2)}
.meta .base{opacity:.72}
.tag{padding:2px 6px;border-radius:6px;font-size:10.5px;font-weight:600;letter-spacing:.01em}
.tag--low{background:var(--minus-soft);color:var(--minus)}
.tag--out{background:var(--minus);color:#fff}
.stepper{flex:none;display:flex;align-items:center;padding:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px}
.stepper button{width:33px;height:33px;border:0;background:transparent;border-radius:9px;font-size:17px;font-weight:600;line-height:1;cursor:pointer}
.stepper button:active{background:var(--line)}
.stepper button[disabled]{opacity:.3}
.qty{min-width:36px;text-align:center;font-size:17px;font-weight:600}
.qty.up{animation:bump .34s;color:var(--plus)}
.qty.down{animation:bump .34s;color:var(--minus)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.32)}100%{transform:scale(1)}}
.empty{padding:34px 18px;text-align:center;color:var(--ink-2);font-size:13.5px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);line-height:1.6}

/* ── todo ───────────────────────────────── */
.todo{position:relative;display:flex;align-items:center;gap:9px;padding:13px 12px 13px 8px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
/* 손잡이에서 시작한 세로 제스처는 화면 스크롤이 아니라 순서 바꾸기로 쓴다 */
.todo__grip{flex:none;width:24px;height:34px;padding:0;border:0;background:transparent;color:var(--ink-2);font-size:15px;line-height:1;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.todo__grip:active{cursor:grabbing}
.todo.has-bg .todo__grip{color:#4b5763}
.todo.is-drag{z-index:5;box-shadow:0 10px 26px rgba(16,21,25,.22)}
#todoList.is-sorting .todo:not(.is-drag){transition:transform .18s cubic-bezier(.2,.8,.2,1)}
.check{flex:none;width:26px;height:26px;padding:0;border:1.5px solid var(--line);border-radius:9px;background:var(--surface);font-size:14px;line-height:1;cursor:pointer}
.todo.done .check{background:var(--ink);border-color:var(--ink);color:var(--ink-on)}
.todo .text{flex:1;min-width:0;padding:0;border:0;background:transparent;text-align:left;font-size:15px;font-weight:500;cursor:pointer;word-break:break-word}
.todo.done .text{text-decoration:line-through;color:var(--ink-2)}
.todo.has-bg,.todo.has-bg .text{color:#141a1f}
.todo.has-bg .check{border-color:rgba(20,26,31,.22);background:rgba(255,255,255,.65);color:#141a1f}
.todo.has-bg.done .check{background:#141a1f;border-color:#141a1f;color:#fff}
.todo.has-bg.done .text{color:rgba(20,26,31,.45)}
.todo.has-bg .icon{background:rgba(255,255,255,.6);color:#4b5763}
.icon{flex:none;width:32px;height:32px;padding:0;border:0;border-radius:9px;background:var(--surface-2);color:var(--ink-2);font-size:13px;cursor:pointer}

/* ── 문자 ────────────────────────────────── */
.card-box{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:15px}
.card-box + .card-box{margin-top:10px}
.box-title{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--ink-2);margin-bottom:11px}
.preview{margin-top:12px;padding:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px}
.preview__top{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-2);margin-bottom:12px}
.bubble{margin-left:auto;max-width:88%;width:fit-content;padding:11px 13px;background:var(--bubble);color:#fff;border-radius:16px 16px 4px 16px;font-size:13.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.bubble__time{margin-top:5px;text-align:right;font-size:10.5px;color:var(--ink-2)}
.counter{display:flex;justify-content:space-between;margin-top:7px;font-size:11.5px;color:var(--ink-2)}
.counter.over{color:var(--minus)}
.sent{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:12.5px}
.sent__to{flex:none;color:var(--ink-2)}
.sent__body{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{margin-top:12px;padding:11px 13px;background:var(--surface-2);border-radius:12px;font-size:11.5px;line-height:1.6;color:var(--ink-2)}

/* ── buttons / bar ──────────────────────── */
.btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:14px;border:0;border-radius:14px;font-size:15px;font-weight:600;cursor:pointer}
.btn--primary{background:var(--ink);color:var(--ink-on)}
.btn--ghost{background:var(--surface);border:1px solid var(--line)}
.btn--danger{background:transparent;border:1px solid var(--line);color:var(--minus)}
.btn:active{transform:scale(.99)}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--bar);border-top:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.bar__in{max-width:560px;margin:0 auto}

/* ── sheet ──────────────────────────────── */
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(9,13,17,.45);opacity:0;transition:opacity .25s}
.panel{position:relative;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:10px 16px calc(18px + env(safe-area-inset-bottom));background:var(--surface);border-radius:22px 22px 0 0;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet.is-open .scrim{opacity:1}
.sheet.is-open .panel{transform:none}
.grip{width:38px;height:4px;margin:2px auto 15px;border-radius:99px;background:var(--line)}
.panel h2{margin:0 0 14px;font-size:19px;font-weight:700;letter-spacing:-.02em}
.field{margin-bottom:12px}
.field label{display:block;margin-bottom:6px;font-size:12px;font-weight:500;color:var(--ink-2)}
.field-row{display:grid;grid-template-columns:1fr 108px;gap:9px}
.hintline{margin:-2px 0 14px;font-size:11.5px;line-height:1.5;color:var(--ink-2)}
.seg{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.seg button{padding:11px 4px;border:1px solid var(--line);border-radius:11px;background:var(--surface);font-size:14px;font-weight:500;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button.is-on{border-color:var(--zone);background:var(--zone);color:#fff}
.seg button.add{border-style:dashed;color:var(--ink-2)}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px}
.swatch{position:relative;display:block;height:44px;border:1px solid var(--line);border-radius:12px;cursor:pointer;color:#141a1f;font-size:15px;font-weight:700;line-height:44px;text-align:center}
.swatch.is-on{outline:2px solid var(--ink);outline-offset:2px}
.swatch--none{color:var(--ink-2);font-size:12px;font-weight:500}
.swatch--pick{overflow:hidden;padding:0;background:conic-gradient(#f87171,#fbbf24,#a3e635,#34d399,#38bdf8,#818cf8,#e879f9,#f87171)}
.swatch--pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;cursor:pointer}
.plc{display:flex;align-items:center;gap:8px;padding:11px 12px;margin-bottom:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:13px}
.plc .icon{width:29px;height:29px;font-size:12px}
.plc__dot{flex:none;width:12px;height:12px;border-radius:4px;background:var(--zone)}
.plc__name{flex:1;min-width:0;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plc__n{flex:none;font-size:12px;color:var(--ink-2)}

/* ── toast ──────────────────────────────── */
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));z-index:80;display:flex;align-items:center;gap:14px;max-width:88vw;padding:11px 16px;border-radius:12px;background:var(--ink);color:var(--ink-on);font-size:13.5px;font-weight:500;transform:translate(-50%,14px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.is-on{opacity:1;transform:translate(-50%,0)}
.toast.has-btn{pointer-events:auto}
.toast__btn{flex:none;border:0;padding:2px 0;background:transparent;color:inherit;font-size:13.5px;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer;white-space:nowrap}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="eyebrow mono" id="today"></div>
    <h1>냉장고 <span>재고</span></h1>
    <div class="stats">
      <button class="stat" data-jump="all">
        <span class="stat__k">상품 종류</span>
        <span class="stat__v mono" id="sKinds">0<i>종</i></span>
      </button>
      <button class="stat" data-jump="all">
        <span class="stat__k">여유</span>
        <span class="stat__v mono" id="sOk">0<i>종</i></span>
      </button>
      <button class="stat stat--alert" data-jump="low">
        <span class="stat__k">안전재고 이하</span>
        <span class="stat__v mono" id="sLow">0<i>종</i></span>
      </button>
    </div>
  </header>

  <div class="tabs" role="tablist">
    <span class="thumb" id="thumb"></span>
    <button class="tab is-on" role="tab" data-tab="fridge">냉장고</button>
    <button class="tab" role="tab" data-tab="todo">할일</button>
    <button class="tab" role="tab" data-tab="sms">문자</button>
  </div>

  <!-- 냉장고 -->
  <section id="viewFridge">
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.6"/>
        <path d="M11 11l3.2 3.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <input id="q" placeholder="상품 검색" autocomplete="off">
    </div>
    <div class="chips" id="filters"></div>
    <div class="list" id="foodList"></div>
  </section>

  <!-- 할일 -->
  <section id="viewTodo" hidden>
    <div class="list" id="todoList"></div>
    <div class="btn-row">
      <button class="btn btn--ghost" id="resetColors">배경색 초기화</button>
      <button class="btn btn--danger" id="clearDone">완료 항목 삭제</button>
    </div>
  </section>

  <!-- 문자 -->
  <section id="viewSms" hidden>
    <div class="card-box">
      <div class="box-title">받는 사람</div>
      <div class="field-row">
        <input id="phone" type="tel" inputmode="tel" placeholder="010-0000-0000" autocomplete="tel">
        <input id="lowLimit" type="number" min="0" max="999" inputmode="numeric" aria-label="기본 안전재고 수량">
      </div>
      <div class="counter"><span id="phoneHint">여러 명은 쉼표로 구분</span><span id="lowHint">기본 안전재고 2</span></div>
    </div>

    <div class="card-box">
      <div class="box-title">보낼 내용</div>
      <div class="chips" id="tpl">
        <button class="chip is-on" data-tpl="shop">장보기 목록</button>
        <button class="chip" data-tpl="stock">재고 전체</button>
        <button class="chip" data-tpl="todo">할일 목록</button>
        <button class="chip" data-tpl="custom">직접 작성</button>
      </div>
      <textarea id="msg" rows="6" placeholder="보낼 내용을 입력하세요"></textarea>
      <div class="counter" id="counter"><span class="mono">0자 · 0바이트</span><span>단문(SMS)</span></div>

      <div class="preview">
        <div class="preview__top"><span id="pvTo">받는 사람 없음</span><span class="mono" id="pvKind">미리보기</span></div>
        <div class="bubble" id="pvBody"></div>
        <div class="bubble__time mono" id="pvTime"></div>
      </div>

      <div class="btn-row">
        <button class="btn btn--ghost" id="copyBtn">내용 복사</button>
        <button class="btn btn--ghost" id="shareBtn">공유</button>
      </div>
      <div class="note" id="smsNote">
        아이폰에서는 <b>메시지</b> 앱이 열리면서 받는 사람과 내용이 채워집니다. 마지막 <b>보내기</b>는 직접 눌러야 하고, 요금은 통신사 문자 요금제를 따릅니다.
        서버에서 자동으로 보내려면 문자 API(솔라피·알리고·NHN Cloud 등) 연동이 필요하고, 스크립트 아래쪽 <b>sendViaApi()</b> 자리에 연결하면 됩니다.
      </div>
    </div>

    <div class="card-box" id="sentBox" hidden>
      <div class="box-title">최근 발송</div>
      <div id="sentList"></div>
    </div>
  </section>

  <p class="note" id="storeNote" hidden></p>
</div>

<div class="bar"><div class="bar__in"><button class="btn btn--primary" id="fab">+ 상품 추가</button></div></div>

<div class="sheet" id="sheet" hidden>
  <div class="scrim" data-close></div>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="grip"></div>
    <h2 id="sheetTitle"></h2>
    <div id="sheetBody"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ────────────────────────────────────────────────
   냉장고 재고 · 할일 · 문자
   - 스와이프로 수량 증감 (오른쪽 채움 / 왼쪽 사용)
   - 부족 상품을 문자 내용으로 자동 작성
──────────────────────────────────────────────── */
const KEY = "fridge_v3";
const OLD_KEY = "fridge_todo_json_v2";
const DEFAULT_PLACES = [
  { name: "냉장", color: "#2f86b4" },
  { name: "냉동", color: "#5568d8" },
  { name: "실온", color: "#b8862b" }
];
const PLACE_COLORS = ["#2f86b4", "#5568d8", "#b8862b", "#0f8f83", "#cf4f46", "#8b5cf6", "#d9752b", "#4a7c3f", "#64748b", "#c2417f"];
const UNITS = ["개", "병", "팩", "봉", "통", "장", "판", "줄", "인분", "g", "kg", "ml", "L"];
const BIG_UNITS = { g: 50, ml: 50 };  /* 이런 단위는 ±1이 무의미해서 증감 폭을 키운다 */
const COLORS = ["", "background:#fff4d6", "background:#ffe1e1", "background:#ffe6cc", "background:#e7f5da",
  "background:#d9f2ee", "background:#ddeefb", "background:#e6e2fb", "background:#fbdff1", "background:#ececee"];

const DEFAULT_DATA = {
  foods: [
    { id: "food001", name: "계란", qty: 10, unit: "개", min: 6, place: "냉장" },
    { id: "food002", name: "닭가슴살", qty: 5, unit: "팩", min: null, place: "냉동" },
    { id: "food003", name: "감자", qty: 6, unit: "개", min: null, place: "실온" },
    { id: "food004", name: "우유", qty: 2, unit: "병", min: 3, place: "냉장" }
  ],
  todos: [
    { id: "todo001", text: "계란 주문하기", done: false, bg: "" },
    { id: "todo002", text: "냉동실 정리하기", done: false, bg: "background:#ddeefb" },
    { id: "todo003", text: "우유 확인하기", done: true, bg: "" }
  ],
  settings: { phone: "", low: 2 },
  sent: []
};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[m]));
const uid = () => Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 7);
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

/* 저장소: localStorage를 쓸 수 없는 환경(미리보기 iframe 등)에서는 메모리로 대체 */
const store = (() => {
  let mem = {}, ok = true;
  try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); } catch (e) { ok = false; }
  return {
    ok,
    get(k) { try { return ok ? localStorage.getItem(k) : (k in mem ? mem[k] : null); } catch (e) { return null; } },
    set(k, v) { try { ok ? localStorage.setItem(k, v) : (mem[k] = v); } catch (e) { mem[k] = v; } }
  };
})();

let db = { foods: [], todos: [], settings: { phone: "", low: 2, places: [] }, sent: [] };
let tab = "fridge", filter = "all", tpl = "shop", firstPaint = true;

const places = () => db.settings.places;
const placeNames = () => places().map(p => p.name);
const zoneOf = name => { const p = places().find(v => v.name === name); return p ? p.color : "var(--line)"; };
const freeColor = () => PLACE_COLORS.find(c => !places().some(p => p.color === c)) || PLACE_COLORS[places().length % PLACE_COLORS.length];

/* ── 초기화 ───────────────────────────── */
function normalize(x) {
  const s = x.settings || {};
  const list = (Array.isArray(s.places) && s.places.length ? s.places : DEFAULT_PLACES)
    .map(p => (typeof p === "string" ? { name: p, color: "" } : { name: String(p.name || ""), color: p.color || "" }))
    .filter(p => p.name);
  const seen = new Set();
  const out = [];
  list.forEach(p => { if (!seen.has(p.name)) { seen.add(p.name); out.push(p); } });

  const foods = (Array.isArray(x.foods) ? x.foods : []).map(f => ({
    id: f.id || uid(), name: String(f.name || "이름 없음"),
    qty: Math.max(0, Number(f.qty) || 0),
    unit: String(f.unit || "개").slice(0, 4) || "개",
    min: (f.min === null || f.min === undefined || f.min === "") ? null : Math.max(0, Number(f.min) || 0),
    place: String(f.place || (out[0] && out[0].name) || "냉장")
  }));
  /* 목록에 없는 보관 위치가 데이터에 있으면 그대로 살려둔다 */
  foods.forEach(f => { if (!seen.has(f.place)) { seen.add(f.place); out.push({ name: f.place, color: "" }); } });
  out.forEach((p, i) => { if (!p.color) p.color = PLACE_COLORS[i % PLACE_COLORS.length]; });

  return {
    foods,
    todos: (Array.isArray(x.todos) ? x.todos : []).map(t => ({
      id: t.id || uid(), text: String(t.text || ""), done: !!t.done, bg: t.bg || ""
    })),
    settings: {
      phone: s.phone || "",
      low: Math.max(0, Number(s.low) || 2),
      places: out
    },
    sent: Array.isArray(x.sent) ? x.sent.slice(0, 5) : []
  };
}

async function init() {
  let raw = store.get(KEY) || store.get(OLD_KEY);
  if (raw) {
    try { db = normalize(JSON.parse(raw)); } catch (e) { db = normalize(DEFAULT_DATA); }
  } else {
    try {
      const r = await fetch("data.json", { cache: "no-store" });
      db = normalize(r.ok ? await r.json() : DEFAULT_DATA);
    } catch (e) {
      db = normalize(DEFAULT_DATA);
    }
    save();
  }

  const d = new Date();
  $("today").textContent = `${d.getFullYear()}.${p2(d.getMonth() + 1)}.${p2(d.getDate())} ${"일월화수목금토"[d.getDay()]}요일`;
  $("phone").value = db.settings.phone;
  $("lowLimit").value = db.settings.low;
  $("lowHint").textContent = `기본 안전재고 ${db.settings.low}`;

  if (!store.ok) {
    $("storeNote").hidden = false;
    $("storeNote").textContent = "이 화면에서는 저장이 임시로 동작합니다. 파일을 휴대폰이나 서버에서 열면 브라우저에 계속 저장됩니다.";
  }

  renderFilters(); renderFood(); renderTodo(); refillMsg(); renderSent();
  firstPaint = false;
}
const p2 = n => String(n).padStart(2, "0");
const save = () => store.set(KEY, JSON.stringify(db));

/* ── 냉장고 ───────────────────────────── */
const minOf = f => (f.min === null || f.min === undefined) ? db.settings.low : f.min;
const isLow = f => f.qty <= minOf(f);
const shortOf = f => Math.max(0, minOf(f) - f.qty);      /* 안전재고까지 모자란 양 */
const amt = (n, f) => `${n}${f.unit}`;          /* 문자·토스트처럼 글자로 쓰는 곳 */
const amtH = (n, f) => `${n}${esc(f.unit)}`;    /* innerHTML로 넣는 곳 (단위는 직접 입력값) */
const stepOf = f => BIG_UNITS[f.unit] || 1;
/* 단위가 섞여 있으면 합계를 하나로 못 묶으니 단위별로 나눠 적는다 */
function sumByUnit(items) {
  const m = new Map();
  items.forEach(f => m.set(f.unit, (m.get(f.unit) || 0) + f.qty));
  return [...m].map(([u, n]) => `${n}${u}`).join(" · ");
}
/* 단위가 제각각이라 부족량 절대값 대신 비율로 정렬한다 (500g과 2병은 비교 불가) */
const shortRate = f => { const m = minOf(f); return m > 0 ? shortOf(f) / m : (f.qty === 0 ? 1 : 0); };
const lowItems = () => db.foods.filter(isLow).sort((a, b) =>
  (b.qty === 0) - (a.qty === 0) || shortRate(b) - shortRate(a) || a.name.localeCompare(b.name, "ko"));

function stats() {
  $("sKinds").innerHTML = db.foods.length + "<i>종</i>";
  $("sOk").innerHTML = db.foods.filter(f => !isLow(f)).length + "<i>종</i>";
  $("sLow").innerHTML = lowItems().length + "<i>종</i>";
}

function visibleFoods() {
  const q = $("q").value.trim().toLowerCase();
  return db.foods.filter(f => {
    if (q && !f.name.toLowerCase().includes(q)) return false;
    if (filter === "low") return isLow(f);
    if (filter !== "all") return f.place === filter;
    return true;
  });
}

function renderFood() {
  stats();
  const list = visibleFoods();
  if (!list.length) {
    const q = $("q").value.trim();
    $("foodList").innerHTML = `<div class="empty">${
      db.foods.length === 0 ? "등록한 상품이 없습니다.<br>아래 ‘상품 추가’로 시작하세요."
      : q ? `‘${esc(q)}’에 맞는 상품이 없습니다.`
      : filter === "low" ? "부족한 상품이 없습니다. 잘 채워져 있어요."
      : `‘${filter}’에 보관 중인 상품이 없습니다.`}</div>`;
    return;
  }
  $("foodList").innerHTML = list.map((f, i) => `
    <article class="row${firstPaint ? " in" : ""}" data-id="${f.id}" data-step="${stepOf(f)}" style="--i:${i}">
      <div class="track" aria-hidden="true">
        <span class="hint hint--plus"><b data-d>+${stepOf(f)}</b>채움</span>
        <span class="hint hint--minus">사용<b data-d>−${stepOf(f)}</b></span>
      </div>
      <div class="card" style="--zone:${zoneOf(f.place)}">
        <button class="main" data-open="${f.id}" aria-label="${esc(f.name)} 수정 · 좌우 방향키로 수량 조절">
          <span class="name">${esc(f.name)}</span>
          <span class="meta">${metaOf(f)}</span>
        </button>
        <div class="stepper">
          <button data-step="-1" aria-label="${esc(f.name)} 줄이기" ${f.qty === 0 ? "disabled" : ""}>−</button>
          <output class="qty mono">${f.qty}</output>
          <button data-step="1" aria-label="${esc(f.name)} 늘리기">+</button>
        </div>
        <button class="icon more" data-open="${f.id}" aria-label="${esc(f.name)} 수정 · 삭제">⋯</button>
      </div>
    </article>`).join("");
}
const metaOf = f => `${esc(f.place)}<span class="mono">${amtH(f.qty, f)}</span><span class="mono base">기준 ${amtH(minOf(f), f)}</span>${tagOf(f)}`;
const tagOf = f => f.qty === 0 ? '<span class="tag tag--out">품절</span>'
  : (isLow(f) ? `<span class="tag tag--low">${shortOf(f) > 0 ? amtH(shortOf(f), f) + " 부족" : "기준선"}</span>` : "");

/* 목록 전체를 다시 그리지 않고 한 줄만 갱신 — 스와이프 애니메이션이 끊기지 않도록 */
function patchRow(id, dir) {
  const f = db.foods.find(v => v.id === id);
  const row = $("foodList").querySelector(`.row[data-id="${id}"]`);
  if (!f || !row) return;
  const out = row.querySelector(".qty");
  out.textContent = f.qty;
  out.classList.remove("up", "down");
  void out.offsetWidth;
  if (dir) out.classList.add(dir > 0 ? "up" : "down");
  row.querySelector(".meta").innerHTML = metaOf(f);
  row.querySelector('[data-step="-1"]').disabled = f.qty === 0;
}

function change(id, d) {
  const f = db.foods.find(v => v.id === id);
  if (!f || !d) return;
  const next = Math.max(0, f.qty + d);
  if (next === f.qty) return;
  f.qty = next;
  save();
  patchRow(id, d);
  stats();
  if (tpl !== "custom") refillMsg();
}

/* ── 스와이프: 오른쪽 = 채움(+), 왼쪽 = 사용(−) ── */
const STEP_1 = 44, STEP_N = 40, MAX_STEP = 9, LIMIT = 170;
let drag = null;

function stepsFor(dx) {
  const a = Math.abs(dx);
  if (a < STEP_1) return 0;
  return Math.min(MAX_STEP, 1 + Math.floor((a - STEP_1) / STEP_N));
}
function rubber(dx) {
  const a = Math.abs(dx);
  return a <= LIMIT ? dx : Math.sign(dx) * (LIMIT + (a - LIMIT) * 0.22);
}
function paint(row, dx, steps) {
  row.classList.toggle("dir-plus", dx > 0);
  row.classList.toggle("dir-minus", dx < 0);
  const n = Math.max(1, steps) * Number(row.dataset.step || 1);
  row.querySelector(".hint--plus [data-d]").textContent = "+" + n;
  row.querySelector(".hint--minus [data-d]").textContent = "−" + n;
}

$("foodList").addEventListener("pointerdown", e => {
  if (e.button > 0 || e.target.closest(".stepper, .more")) return;
  const card = e.target.closest(".card");
  if (!card) return;
  delete card.dataset.skip;
  drag = { card, row: card.closest(".row"), id: card.closest(".row").dataset.id, x: e.clientX, y: e.clientY, steps: 0, on: false, pid: e.pointerId };
  card.style.transition = "none";
});

window.addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.pid) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.on) {
    if (Math.abs(dx) < 10 || Math.abs(dx) < Math.abs(dy)) return;
    drag.on = true;
    drag.row.classList.add("is-drag");
    try { drag.card.setPointerCapture(e.pointerId); } catch (err) {}
  }
  if (e.cancelable) e.preventDefault();
  drag.dx = dx;
  drag.card.style.transform = `translate3d(${rubber(dx)}px,0,0)`;
  const s = stepsFor(dx);
  if (s !== drag.steps) { drag.steps = s; if (s) buzz(7); }
  paint(drag.row, dx, s);
}, { passive: false });

function endDrag() {
  if (!drag) return;
  const { card, row, id, steps, dx } = drag;
  card.style.transition = "transform .26s cubic-bezier(.2,.8,.2,1)";
  card.style.transform = "";
  row.classList.remove("is-drag", "dir-plus", "dir-minus");
  if (drag.on) card.dataset.skip = "1";
  drag = null;
  if (steps > 0) {
    const f = db.foods.find(v => v.id === id);
    if (!f) return;
    const d = Math.sign(dx) * steps * stepOf(f);
    const applied = Math.max(0, f.qty + d) - f.qty;
    change(id, d);
    if (applied) { buzz(14); toast(`${f.name} ${applied > 0 ? "+" : ""}${applied}${f.unit} → ${amt(f.qty, f)}`); }
    else toast(`${f.name}은(는) 이미 0${f.unit}입니다`);
  }
}
window.addEventListener("pointerup", endDrag);
window.addEventListener("pointercancel", endDrag);

function stepBy(id, dir) {
  const f = db.foods.find(v => v.id === id);
  if (f) change(id, dir * stepOf(f));
}

$("foodList").addEventListener("click", e => {
  const card = e.target.closest(".card");
  if (card && card.dataset.skip) { delete card.dataset.skip; return; }
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.step) stepBy(b.closest(".row").dataset.id, Number(b.dataset.step));
  else if (b.dataset.open) openFood(b.dataset.open);
});

$("foodList").addEventListener("keydown", e => {
  const b = e.target.closest(".main");
  if (!b) return;
  const id = b.closest(".row").dataset.id;
  if (e.key === "ArrowRight") { e.preventDefault(); stepBy(id, 1); }
  if (e.key === "ArrowLeft") { e.preventDefault(); stepBy(id, -1); }
});

/* ── 할일 ─────────────────────────────── */
function renderTodo() {
  if (!db.todos.length) {
    $("todoList").innerHTML = `<div class="empty">할일이 없습니다.<br>아래 ‘할일 추가’를 눌러 적어두세요.</div>`;
    return;
  }
  $("todoList").innerHTML = db.todos.map(t => `
    <div class="todo${t.done ? " done" : ""}${t.bg ? " has-bg" : ""}" data-id="${t.id}" style="${esc(t.bg || "")}">
      <button class="todo__grip" aria-label="${esc(t.text)} 순서 옮기기 · 위아래로 끌거나 방향키">≡</button>
      <button class="check" data-t="toggle" aria-label="${t.done ? "완료 취소" : "완료 표시"}">${t.done ? "✓" : ""}</button>
      <button class="text" data-t="edit">${esc(t.text)}</button>
      <button class="icon" data-t="color" aria-label="배경색 고르기">◐</button>
      <button class="icon" data-t="del" aria-label="삭제">✕</button>
    </div>`).join("");
}

$("todoList").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  const id = b.closest(".todo").dataset.id;
  const t = db.todos.find(v => v.id === id);
  if (!t) return;
  if (b.dataset.t === "toggle") { t.done = !t.done; save(); renderTodo(); if (tpl !== "custom") refillMsg(); }
  if (b.dataset.t === "color") openColor(t);
  if (b.dataset.t === "edit") openTodo(t);
  if (b.dataset.t === "del") { db.todos = db.todos.filter(v => v.id !== id); save(); renderTodo(); toast("할일을 삭제했습니다"); if (tpl !== "custom") refillMsg(); }
});

/* ── 할일 순서 바꾸기 (손잡이를 위아래로) ── */
let sort = null;

function moveTodo(from, to) {
  if (from === to || from < 0 || to < 0 || to >= db.todos.length) return false;
  db.todos.splice(to, 0, db.todos.splice(from, 1)[0]);
  save(); renderTodo();
  if (tpl !== "custom") refillMsg();
  return true;
}

$("todoList").addEventListener("pointerdown", e => {
  const grip = e.target.closest(".todo__grip");
  if (!grip || e.button > 0) return;
  const rows = [...$("todoList").querySelectorAll(".todo")];
  const from = rows.indexOf(grip.closest(".todo"));
  if (from < 0) return;

  const sy = window.scrollY;
  const box = rows[from].getBoundingClientRect();
  sort = {
    rows, from, to: from, pid: e.pointerId,
    row: rows[from], h: box.height,
    y: e.clientY + sy,
    /* 문서 좌표로 재둬야 드래그 중 화면이 밀려도 계산이 어긋나지 않는다 */
    mid: rows.map(r => { const b = r.getBoundingClientRect(); return b.top + sy + b.height / 2; }),
    /* .list의 gap을 직접 읽어 CSS와 어긋날 일이 없게 한다 */
    gap: rows.length > 1
      ? rows[1].getBoundingClientRect().top - rows[0].getBoundingClientRect().bottom
      : 8
  };
  $("todoList").classList.add("is-sorting");
  rows[from].classList.add("is-drag");
  try { grip.setPointerCapture(e.pointerId); } catch (err) {}
  e.preventDefault();
});

window.addEventListener("pointermove", e => {
  if (!sort || e.pointerId !== sort.pid) return;
  if (e.cancelable) e.preventDefault();

  /* 목록 끝으로 끌고 갈 때 따라 스크롤 */
  const edge = 90, vh = window.innerHeight;
  if (e.clientY < edge) window.scrollBy(0, -Math.min(16, (edge - e.clientY) / 3));
  else if (e.clientY > vh - edge) window.scrollBy(0, Math.min(16, (e.clientY - (vh - edge)) / 3));

  const dy = e.clientY + window.scrollY - sort.y;
  sort.row.style.transform = `translate3d(0,${dy}px,0)`;

  const c = sort.mid[sort.from] + dy;
  let to = sort.from;
  sort.mid.forEach((m, i) => {
    if (i === sort.from) return;
    if (i < sort.from && c < m) to = Math.min(to, i);
    if (i > sort.from && c > m) to = Math.max(to, i);
  });
  if (to !== sort.to) { sort.to = to; buzz(6); }

  /* 자리를 비켜주는 줄들은 끌고 있는 줄의 높이만큼만 움직이면 된다 */
  const shift = sort.h + sort.gap;
  sort.rows.forEach((r, i) => {
    if (i === sort.from) return;
    const d = (i > sort.from && i <= sort.to) ? -shift
      : (i < sort.from && i >= sort.to) ? shift : 0;
    r.style.transform = d ? `translate3d(0,${d}px,0)` : "";
  });
}, { passive: false });

function endSort() {
  if (!sort) return;
  const { from, to, rows } = sort;
  $("todoList").classList.remove("is-sorting");
  rows.forEach(r => { r.style.transform = ""; r.classList.remove("is-drag"); });
  sort = null;
  if (moveTodo(from, to)) buzz(12);
}
window.addEventListener("pointerup", endSort);
window.addEventListener("pointercancel", endSort);

/* 손잡이에 초점을 두고 방향키로도 옮길 수 있게 */
$("todoList").addEventListener("keydown", e => {
  const grip = e.target.closest(".todo__grip");
  if (!grip) return;
  const dir = e.key === "ArrowUp" ? -1 : e.key === "ArrowDown" ? 1 : 0;
  if (!dir) return;
  e.preventDefault();
  const rows = [...$("todoList").querySelectorAll(".todo")];
  const from = rows.indexOf(grip.closest(".todo"));
  const to = from + dir;
  if (!moveTodo(from, to)) return;
  const next = $("todoList").querySelectorAll(".todo__grip")[to];
  if (next) next.focus();
});

$("resetColors").onclick = () => { db.todos.forEach(t => t.bg = ""); save(); renderTodo(); };
$("clearDone").onclick = () => {
  const n = db.todos.filter(t => t.done).length;
  if (!n) return toast("완료한 할일이 없습니다");
  db.todos = db.todos.filter(t => !t.done); save(); renderTodo(); toast(`${n}개를 삭제했습니다`);
};

/* ── 문자 ─────────────────────────────── */
function smsBytes(s) {
  let n = 0;
  for (const ch of s) { const c = ch.codePointAt(0); n += c < 128 ? 1 : c <= 0xffff ? 2 : 4; }
  return n;
}
function buildMsg(kind) {
  const d = new Date(), day = `${p2(d.getMonth() + 1)}/${p2(d.getDate())}`;
  if (kind === "shop") {
    const items = lowItems();
    if (!items.length) return `[냉장고 ${day}]\n안전재고 아래로 내려간 상품이 없습니다.`;
    return `[장보기 ${day}]\n` + items.map(f => {
      const need = shortOf(f);
      if (need > 0) {
        const state = f.qty === 0 ? "품절" : `현재 ${amt(f.qty, f)}`;
        return `- ${f.name} ${amt(need, f)} 부족 (${state} / 기준 ${amt(minOf(f), f)})`;
      }
      return `- ${f.name} ${amt(f.qty, f)} (기준선)`;
    }).join("\n");
  }
  if (kind === "stock") {
    if (!db.foods.length) return `[냉장고 ${day}]\n등록된 상품이 없습니다.`;
    return `[재고 ${day}]\n` + placeNames().filter(p => db.foods.some(f => f.place === p))
      .map(p => `${p}: ` + db.foods.filter(f => f.place === p)
        .map(f => `${f.name} ${amt(f.qty, f)}${isLow(f) ? "(부족)" : ""}`).join(", ")).join("\n");
  }
  if (kind === "todo") {
    const t = db.todos.filter(x => !x.done);
    if (!t.length) return `[할일 ${day}]\n남은 할일이 없습니다.`;
    return `[할일 ${day}]\n` + t.map(x => `- ${x.text}`).join("\n");
  }
  return $("msg").value;
}
function refillMsg() {
  if (tpl !== "custom") $("msg").value = buildMsg(tpl);
  updatePreview();
}
function updatePreview() {
  const body = $("msg").value, bytes = smsBytes(body), phone = $("phone").value.trim();
  const kind = bytes <= 90 ? "단문(SMS)" : bytes <= 2000 ? "장문(LMS)" : "2000바이트 초과";
  const c = $("counter");
  c.classList.toggle("over", bytes > 2000);
  c.children[0].textContent = `${[...body].length}자 · ${bytes}바이트`;
  c.children[1].textContent = kind;
  $("pvTo").textContent = phone ? `받는 사람 ${phone}` : "받는 사람 없음";
  $("pvKind").textContent = kind;
  $("pvBody").textContent = body || "보낼 내용이 비어 있습니다";
  const d = new Date();
  $("pvTime").textContent = `${d.getHours() < 12 ? "오전" : "오후"} ${p2(d.getHours() % 12 || 12)}:${p2(d.getMinutes())}`;
}

$("msg").addEventListener("input", () => {
  if (tpl !== "custom") {
    tpl = "custom";
    $("tpl").querySelectorAll(".chip").forEach(c => c.classList.toggle("is-on", c.dataset.tpl === "custom"));
  }
  updatePreview();
});
$("tpl").addEventListener("click", e => {
  const b = e.target.closest(".chip");
  if (!b) return;
  tpl = b.dataset.tpl;
  $("tpl").querySelectorAll(".chip").forEach(c => c.classList.toggle("is-on", c === b));
  if (tpl === "custom") { $("msg").focus(); updatePreview(); } else refillMsg();
});
$("phone").addEventListener("input", () => { db.settings.phone = $("phone").value.trim(); save(); updatePreview(); });
$("lowLimit").addEventListener("input", () => {
  db.settings.low = Math.max(0, Number($("lowLimit").value) || 0);
  $("lowHint").textContent = `기본 안전재고 ${db.settings.low}`;
  save(); renderFood(); if (tpl !== "custom") refillMsg();
});

/* 아이폰 메시지 앱: sms:번호&body=내용 (여러 명은 sms:/open?addresses=...)
   안드로이드: sms:번호?body=내용 */
function smsHref(numbers, body) {
  const b = encodeURIComponent(body);
  if (isIOS) {
    return numbers.length > 1
      ? `sms:/open?addresses=${numbers.join(",")}&body=${b}`
      : `sms:${numbers[0]}&body=${b}`;
  }
  return `sms:${numbers.join(",")}?body=${b}`;
}
function sendSms() {
  const numbers = $("phone").value.split(/[,;]/).map(s => s.replace(/[^0-9+]/g, "")).filter(Boolean);
  const body = $("msg").value;
  if (!numbers.length) { $("phone").focus(); return toast("받는 사람 번호를 입력하세요"); }
  if (!body.trim()) { $("msg").focus(); return toast("보낼 내용을 입력하세요"); }

  /* iOS Safari는 location 변경보다 링크 클릭이 안정적이다 */
  const a = document.createElement("a");
  a.href = smsHref(numbers, body);
  a.style.display = "none";
  document.body.appendChild(a);
  try { a.click(); } catch (e) { try { window.location.href = a.href; } catch (err) {} }
  setTimeout(() => a.remove(), 500);

  db.sent.unshift({ t: Date.now(), to: $("phone").value.trim(), body });
  db.sent = db.sent.slice(0, 5);
  save(); renderSent();
  setTimeout(() => toast(isIOS ? "메시지 앱에서 보내기를 눌러 주세요" : "문자 앱에서 보내기를 눌러 주세요"), 900);
}
function renderSent() {
  $("sentBox").hidden = !db.sent.length;
  $("sentList").innerHTML = db.sent.map(s => {
    const d = new Date(s.t);
    return `<div class="sent"><span class="sent__to mono">${p2(d.getMonth() + 1)}/${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}</span><span class="sent__body">${esc(s.body.replace(/\n/g, " "))}</span></div>`;
  }).join("");
}
$("copyBtn").onclick = async () => {
  const t = $("msg").value;
  try { await navigator.clipboard.writeText(t); toast("내용을 복사했습니다"); }
  catch (e) {
    const ta = document.createElement("textarea");
    ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast("내용을 복사했습니다"); } catch (err) { toast("복사할 수 없는 환경입니다"); }
    ta.remove();
  }
};
$("shareBtn").onclick = async () => {
  if (!navigator.share) return toast("이 브라우저는 공유를 지원하지 않습니다");
  try { await navigator.share({ text: $("msg").value }); } catch (e) {}
};

/*  서버 자동 발송을 붙일 자리.
    솔라피·알리고·NHN Cloud 같은 문자 API는 인증키를 브라우저에 두면 안 되므로
    본인 서버(또는 서버리스 함수)에 아래 엔드포인트를 만들고 그쪽에서 API를 호출하세요.

async function sendViaApi(to, text){
  const r = await fetch("/api/sms", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ to, text })
  });
  if(!r.ok) throw new Error("발송 실패");
  return r.json();
}
*/

/* ── 탭 ───────────────────────────────── */
const VIEWS = { fridge: "viewFridge", todo: "viewTodo", sms: "viewSms" };
const LABEL = { fridge: "+ 상품 추가", todo: "+ 할일 추가", sms: isIOS ? "메시지 앱으로 보내기" : "문자 앱으로 보내기" };
function setTab(name) {
  tab = name;
  const i = Object.keys(VIEWS).indexOf(name);
  $("thumb").style.transform = `translateX(${i * 100}%)`;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("is-on", t.dataset.tab === name));
  Object.entries(VIEWS).forEach(([k, v]) => $(v).hidden = k !== name);
  $("fab").textContent = LABEL[name];
  if (name === "sms") refillMsg();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
document.querySelector(".tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab");
  if (b) setTab(b.dataset.tab);
});
document.querySelectorAll("[data-jump]").forEach(b => b.onclick = () => {
  setTab("fridge");
  setFilter(b.dataset.jump === "low" ? "low" : "all");
});
function renderFilters() {
  if (filter !== "all" && filter !== "low" && !placeNames().includes(filter)) filter = "all";
  $("filters").innerHTML =
    `<button class="chip${filter === "all" ? " is-on" : ""}" data-filter="all">전체</button>` +
    places().map(p => `<button class="chip${filter === p.name ? " is-on" : ""}" data-filter="${esc(p.name)}" style="--zone:${p.color}"><i class="dot"></i>${esc(p.name)}</button>`).join("") +
    `<button class="chip${filter === "low" ? " is-on" : ""}" data-filter="low">부족만</button>` +
    `<button class="chip" data-manage="1">위치 편집</button>`;
}
function setFilter(f) {
  filter = f;
  $("filters").querySelectorAll(".chip").forEach(c => c.classList.toggle("is-on", c.dataset.filter === f));
  renderFood();
}
$("filters").addEventListener("click", e => {
  const b = e.target.closest(".chip");
  if (!b) return;
  if (b.dataset.manage) openPlaces();
  else setFilter(b.dataset.filter);
});
$("q").addEventListener("input", renderFood);
$("fab").onclick = () => tab === "fridge" ? openFood() : tab === "todo" ? openTodo() : sendSms();

/* ── 시트 ─────────────────────────────── */
function openSheet(title, html, onReady) {
  $("sheetTitle").textContent = title;
  $("sheetBody").innerHTML = html;
  $("sheet").hidden = false;
  requestAnimationFrame(() => $("sheet").classList.add("is-open"));
  onReady && onReady();
}
function closeSheet() {
  $("sheet").classList.remove("is-open");
  setTimeout(() => { $("sheet").hidden = true; $("sheetBody").innerHTML = ""; }, 260);
}
$("sheet").addEventListener("click", e => { if (e.target.dataset.close !== undefined) closeSheet(); });
window.addEventListener("keydown", e => { if (e.key === "Escape" && !$("sheet").hidden) closeSheet(); });

/* ── 보관 위치(냉장고 이름) ─────────────── */
/* 실제로 저장된 이름을 돌려준다 — 12자로 자른 뒤의 이름을 쓰지 않으면
   상품이 목록에 없는 보관 위치에 배정된다 */
function addPlace(name) {
  name = String(name).trim().slice(0, 12);
  if (!name) return null;
  if (placeNames().includes(name)) { toast(`‘${name}’은(는) 이미 있습니다`); return null; }
  places().push({ name, color: freeColor() });
  save();
  return name;
}

/* 이름을 바꾸면 그 위치에 들어 있던 상품의 place도 같이 따라가야 한다 */
function renamePlace(oldName) {
  const p = places().find(v => v.name === oldName);
  if (!p) return;
  const input = prompt("보관 위치 이름 수정", oldName);
  if (input === null) return;
  const name = String(input).trim().slice(0, 12);
  if (!name || name === oldName) return;
  if (placeNames().includes(name)) return toast(`‘${name}’은(는) 이미 있습니다`);

  p.name = name;
  db.foods.forEach(f => { if (f.place === oldName) f.place = name; });
  if (filter === oldName) filter = name;
  save(); renderFilters(); renderFood(); renderPlaces();
  if (tpl !== "custom") refillMsg();
  toast(`‘${oldName}’을(를) ‘${name}’(으)로 바꿨습니다`);
}

let undoBin = null;
function removePlace(name) {
  if (places().length <= 1) return toast("보관 위치는 최소 1개가 필요합니다");
  const used = db.foods.filter(f => f.place === name);
  const msg = used.length
    ? `‘${name}’을(를) 지우면 그 안의 상품 ${used.length}종(${sumByUnit(used)})도 함께 삭제됩니다.\n계속할까요?`
    : `‘${name}’을(를) 삭제할까요?`;
  if (!confirm(msg)) return;

  undoBin = { index: places().findIndex(p => p.name === name), place: places().find(p => p.name === name), foods: db.foods.slice() };
  db.foods = db.foods.filter(f => f.place !== name);
  db.settings.places = places().filter(p => p.name !== name);
  if (filter === name) filter = "all";
  save(); renderFilters(); renderFood(); renderPlaces();
  if (tpl !== "custom") refillMsg();
  toast(used.length ? `‘${name}’과 상품 ${used.length}종을 삭제했습니다` : `‘${name}’을(를) 삭제했습니다`, "되돌리기", undoPlace);
}
function undoPlace() {
  if (!undoBin) return;
  places().splice(undoBin.index, 0, undoBin.place);
  db.foods = undoBin.foods;
  undoBin = null;
  save(); renderFilters(); renderFood(); renderPlaces();
  if (tpl !== "custom") refillMsg();
  toast("되돌렸습니다");
}
function renderPlaces() {
  const el = $("plcList");
  if (!el) return;
  el.innerHTML = places().map(p => {
    const items = db.foods.filter(f => f.place === p.name);
    return `<div class="plc" style="--zone:${p.color}">
      <span class="plc__dot"></span>
      <span class="plc__name">${esc(p.name)}</span>
      <span class="plc__n mono">${items.length}종${items.length ? " · " + esc(sumByUnit(items)) : ""}</span>
      <button class="icon" data-rename="${esc(p.name)}" aria-label="${esc(p.name)} 이름 수정">✎</button>
      <button class="icon" data-color="${esc(p.name)}" aria-label="${esc(p.name)} 색상 고르기">◐</button>
      <button class="icon" data-del="${esc(p.name)}" aria-label="${esc(p.name)} 삭제">✕</button>
    </div>`;
  }).join("");
}
function openPlaces() {
  openSheet("보관 위치", `
    <div id="plcList"></div>
    <div class="field" style="margin-top:14px">
      <label for="plcName">새 위치 추가</label>
      <div class="field-row">
        <input id="plcName" placeholder="예: 김치냉장고" maxlength="12">
        <button class="btn btn--ghost" id="plcAdd">추가</button>
      </div>
    </div>
    <div class="note">✕ 를 누르면 그 위치에 들어 있는 <b>상품까지 모두 삭제</b>됩니다. 지운 직후 뜨는 ‘되돌리기’로 복구할 수 있습니다.</div>
  `, () => {
    renderPlaces();
    const add = () => {
      const added = addPlace($("plcName").value);
      if (!added) return;
      $("plcName").value = "";
      renderFilters(); renderPlaces(); renderFood();
      toast(`‘${added}’을(를) 추가했습니다`);
    };
    $("plcAdd").onclick = add;
    $("plcName").onkeydown = e => { if (e.key === "Enter") add(); };
    $("plcList").onclick = e => {
      const b = e.target.closest("button");
      if (!b) return;
      if (b.dataset.del) removePlace(b.dataset.del);
      if (b.dataset.rename) renamePlace(b.dataset.rename);
      if (b.dataset.color) openPlaceColor(b.dataset.color);
    };
  });
}

/* 위치 색상 직접 고르기 */
function placeColorGrid(current) {
  const known = PLACE_COLORS.includes(current);
  return PLACE_COLORS.map(c => `<button class="swatch ${current === c ? "is-on" : ""}" data-c="${c}" style="background:${c}" aria-label="색상"></button>`).join("")
    + `<label class="swatch swatch--pick ${known ? "" : "is-on"}" title="직접 고르기">
         <input type="color" id="pickPlace" value="${known ? current : (current || "#2f86b4")}" aria-label="색상 직접 고르기">
       </label>`;
}
function openPlaceColor(name) {
  const p = places().find(v => v.name === name);
  if (!p) return;
  openSheet(`‘${name}’ 색상`, `
    <div class="swatches" id="pcGrid">${placeColorGrid(p.color)}</div>
    <button class="btn btn--primary" id="pcDone" style="margin-top:16px">완료</button>
  `, () => {
    const el = $("pcGrid");
    const apply = (c, on) => {
      p.color = c;
      el.querySelectorAll(".swatch").forEach(x => x.classList.toggle("is-on", x === on));
      save(); renderFilters(); renderFood();
    };
    el.onclick = e => {
      const b = e.target.closest(".swatch");
      if (!b || b.classList.contains("swatch--pick")) return;
      apply(b.dataset.c, b);
    };
    const pick = $("pickPlace");
    pick.oninput = () => {
      const box = pick.closest(".swatch");
      box.style.background = pick.value;
      apply(pick.value, box);
    };
    $("pcDone").onclick = openPlaces;
  });
}

function placeSeg(current) {
  return places().map(p => `<button data-p="${esc(p.name)}" style="--zone:${p.color}" class="${current === p.name ? "is-on" : ""}">${esc(p.name)}</button>`).join("")
    + `<button class="add" data-add="1">+ 위치</button>`;
}

function openFood(id) {
  const f = id ? db.foods.find(v => v.id === id) : null;
  /* 보관 위치를 골라 놓고 추가하면 그 위치로 시작한다 (filter는 all·low일 수도 있다) */
  let place = f ? f.place
    : (placeNames().includes(filter) ? filter : (placeNames()[0] || "냉장"));
  openSheet(f ? "상품 수정" : "상품 추가", `
    <div class="field field-row">
      <div><label for="fName">상품명</label><input id="fName" placeholder="예: 우유" value="${f ? esc(f.name) : ""}"></div>
      <div><label for="fQty">수량</label><input id="fQty" type="number" min="0" inputmode="numeric" value="${f ? f.qty : 1}"></div>
    </div>
    <div class="field field-row">
      <div>
        <label for="fUnit">단위</label>
        <input id="fUnit" maxlength="4" placeholder="개" value="${f ? esc(f.unit) : "개"}">
      </div>
      <div>
        <label for="fMin">안전재고</label>
        <input id="fMin" type="number" min="0" inputmode="numeric" placeholder="기본 ${db.settings.low}" value="${f && f.min !== null ? f.min : ""}">
      </div>
    </div>
    <div class="chips" id="fUnits">${UNITS.map(u => `<button class="chip${(f ? f.unit : "개") === u ? " is-on" : ""}" data-u="${u}">${u}</button>`).join("")}</div>
    <p class="hintline" id="fHint"></p>
    <div class="field">
      <label>보관 위치</label>
      <div class="seg" id="fPlace">${placeSeg(place)}</div>
    </div>
    <button class="btn btn--primary" id="fSave">${f ? "저장" : "추가"}</button>
    ${f ? '<button class="btn btn--danger" id="fDel" style="margin-top:8px">삭제</button>' : ""}
  `, () => {
    const unitVal = () => ($("fUnit").value.trim() || "개");
    const hint = () => {
      const u = unitVal();
      const m = $("fMin").value.trim() === "" ? db.settings.low : Math.max(0, Number($("fMin").value) || 0);
      const step = BIG_UNITS[u] || 1;
      $("fHint").textContent = `${m}${u} 이하로 떨어지면 부족으로 보고 장보기 문자에 넣습니다`
        + (step > 1 ? ` · ± 버튼은 ${step}${u}씩 움직입니다` : "");
      $("fUnits").querySelectorAll(".chip").forEach(c => c.classList.toggle("is-on", c.dataset.u === u));
    };
    hint();
    $("fUnit").oninput = hint;
    $("fMin").oninput = hint;
    $("fUnits").onclick = e => {
      const b = e.target.closest(".chip");
      if (!b) return;
      $("fUnit").value = b.dataset.u;
      hint();
    };
    $("fPlace").onclick = e => {
      const b = e.target.closest("button");
      if (!b) return;
      if (b.dataset.add) {
        const name = prompt("새 보관 위치 이름 (예: 김치냉장고)");
        if (!name || !name.trim()) return;
        const added = addPlace(name);
        if (!added) return;
        place = added;
        $("fPlace").innerHTML = placeSeg(place);
        renderFilters();
        return;
      }
      place = b.dataset.p;
      $("fPlace").querySelectorAll("button").forEach(x => x.classList.toggle("is-on", x === b));
    };
    if (!f) setTimeout(() => $("fName").focus(), 320);
    $("fName").onkeydown = e => { if (e.key === "Enter") $("fSave").click(); };
    $("fSave").onclick = () => {
      const name = $("fName").value.trim();
      const qty = Math.max(0, parseInt($("fQty").value, 10) || 0);
      const unit = unitVal();
      const minRaw = $("fMin").value.trim();
      const min = minRaw === "" ? null : Math.max(0, parseInt(minRaw, 10) || 0);
      if (!name) { $("fName").focus(); return toast("상품명을 입력하세요"); }
      if (f) { f.name = name; f.qty = qty; f.unit = unit; f.min = min; f.place = place; }
      else {
        const same = db.foods.find(v => v.name === name && v.place === place && v.unit === unit);
        if (same) same.qty += qty;
        else db.foods.unshift({ id: uid(), name, qty, unit, min, place });
      }
      save(); closeSheet(); renderFood(); if (tpl !== "custom") refillMsg();
      toast(f ? "저장했습니다" : `${name}을(를) 추가했습니다`);
    };
    if (f) $("fDel").onclick = () => {
      if (!confirm(`‘${f.name}’을(를) 삭제할까요?`)) return;
      db.foods = db.foods.filter(v => v.id !== f.id);
      save(); closeSheet(); renderFood(); if (tpl !== "custom") refillMsg();
      toast(`${f.name}을(를) 삭제했습니다`);
    };
  });
}

function swatchGrid(current) {
  const known = COLORS.includes(current);
  return COLORS.map(c => `<button class="swatch ${c ? "" : "swatch--none"} ${current === c ? "is-on" : ""}" data-c="${c}" style="${c || "background:var(--surface-2)"}" aria-label="${c ? "배경색" : "색 없음"}">${c ? "" : "없음"}</button>`).join("")
    + `<label class="swatch swatch--pick ${!known && current ? "is-on" : ""}" title="직접 고르기">
         <input type="color" id="pickColor" value="${!known && current ? current.replace("background:", "") : "#ffd9a0"}" aria-label="배경색 직접 고르기">
       </label>`;
}
function bindSwatches(el, onPick) {
  el.onclick = e => {
    const b = e.target.closest(".swatch");
    if (!b || b.classList.contains("swatch--pick")) return;
    el.querySelectorAll(".swatch").forEach(x => x.classList.toggle("is-on", x === b));
    onPick(b.dataset.c);
  };
  const pick = el.querySelector("#pickColor");
  if (pick) pick.oninput = () => {
    const c = `background:${pick.value}`;
    pick.closest(".swatch").style.background = pick.value;
    el.querySelectorAll(".swatch").forEach(x => x.classList.toggle("is-on", x === pick.closest(".swatch")));
    onPick(c);
  };
}

/* 목록에서 색만 바꿀 때 */
function openColor(t) {
  openSheet("배경색", `
    <div class="swatches" id="cBg">${swatchGrid(t.bg || "")}</div>
    <button class="btn btn--primary" id="cDone" style="margin-top:16px">완료</button>
  `, () => {
    bindSwatches($("cBg"), c => { t.bg = c; save(); renderTodo(); });
    $("cDone").onclick = closeSheet;
  });
}

function openTodo(t) {
  openSheet(t ? "할일 수정" : "할일 추가", `
    <div class="field"><label for="tText">할일</label><input id="tText" placeholder="예: 계란 주문하기" value="${t ? esc(t.text) : ""}"></div>
    <div class="field">
      <label>배경색</label>
      <div class="swatches" id="tBg">${swatchGrid((t && t.bg) || "")}</div>
    </div>
    <button class="btn btn--primary" id="tSave">${t ? "저장" : "추가"}</button>
  `, () => {
    let bg = t ? t.bg : "";
    bindSwatches($("tBg"), c => { bg = c; });
    if (!t) setTimeout(() => $("tText").focus(), 320);
    $("tText").onkeydown = e => { if (e.key === "Enter") $("tSave").click(); };
    $("tSave").onclick = () => {
      const text = $("tText").value.trim();
      if (!text) { $("tText").focus(); return toast("할일을 입력하세요"); }
      if (t) { t.text = text; t.bg = bg; }
      else db.todos.push({ id: uid(), text, done: false, bg });
      save(); closeSheet(); renderTodo(); if (tpl !== "custom") refillMsg();
    };
  });
}

/* ── 토스트 ───────────────────────────── */
let toastTimer;
function toast(msg, actionLabel, onAction) {
  const el = $("toast");
  el.innerHTML = "";
  const s = document.createElement("span");
  s.textContent = msg;
  el.appendChild(s);
  const withBtn = !!(actionLabel && onAction);
  if (withBtn) {
    const b = document.createElement("button");
    b.className = "toast__btn";
    b.textContent = actionLabel;
    b.onclick = () => { el.classList.remove("is-on", "has-btn"); onAction(); };
    el.appendChild(b);
  }
  el.classList.toggle("has-btn", withBtn);
  el.classList.add("is-on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("is-on", "has-btn"), withBtn ? 6000 : 2000);
}

init();
</script>
